<title>Aventuras sin Rumbo</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #FF6B35;
    --accent: #1AC8EB;
    --bg: #0A0E27;
    --text: #F5F5F5;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  section {
    padding: 150px 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  h1 {
    font-size: 4em;
    margin-bottom: 20px;
    font-weight: 700;
  }

  p {
    font-size: 1.2em;
    color: #AAA;
    margin-bottom: 15px;
  }

  .btn {
    display: inline-block;
    padding: 15px 40px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 1em;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.3s;
    font-weight: 600;
  }

  .btn:hover {
    opacity: 0.9;
  }

  .btn-secondary {
    background: var(--accent);
    color: var(--bg);
  }

  /* MODAL */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.8);
    align-items: center;
    justify-content: center;
  }

  .modal.active {
    display: flex;
  }

  .modal-content {
    background: var(--bg);
    padding: 60px 50px;
    border-radius: 8px;
    width: 90%;
    max-width: 400px;
    border: 1px solid rgba(255, 107, 53, 0.2);
  }

  .modal-close {
    float: right;
    font-size: 1.5em;
    color: #888;
    cursor: pointer;
    transition: color 0.3s;
  }

  .modal-close:hover {
    color: var(--primary);
  }

  .modal h2 {
    color: var(--text);
    margin-bottom: 30px;
    font-size: 2em;
    clear: both;
  }

  input {
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 107, 53, 0.2);
    border-radius: 6px;
    color: var(--text);
    font-size: 1em;
  }

  input:focus {
    outline: none;
    border-color: var(--primary);
    background: rgba(255, 107, 53, 0.1);
  }

  .aventuras-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 80px;
    margin-top: 60px;
  }

  .aventura-item {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .aventura-emoji {
    font-size: 5em;
    line-height: 1;
  }

  .aventura-nombre {
    font-size: 1.8em;
    font-weight: 600;
    color: var(--text);
  }

  .aventura-ubicacion {
    color: #888;
    font-size: 0.95em;
  }

  @media (max-width: 768px) {
    section {
      padding: 80px 0;
      min-height: auto;
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 15px;
    }

    p {
      font-size: 1em;
    }

    .btn {
      padding: 15px 30px;
      font-size: 0.95em;
      display: block;
      width: 100%;
      max-width: 250px;
      margin: 10px auto;
    }

    .modal-content {
      padding: 40px 30px;
      width: 95%;
    }

    .modal h2 {
      font-size: 1.5em;
    }

    input {
      padding: 16px;
      font-size: 16px;
    }

    .aventura-emoji {
      font-size: 3em;
    }

    .aventura-nombre {
      font-size: 1.3em;
    }
  }
</style>

<section id="home">
  <div class="container" style="text-align: center;">
    <h1>Aventuras sin Rumbo</h1>
    <p>Explorando Formosa</p>
    <div style="margin-top: 40px; display: flex; gap: 20px; justify-content: center;">
      <a href="aventuras.html" class="btn">Comenzar</a>
      <a href="https://www.tiktok.com/@aventurassinrumbo_" target="_blank" class="btn btn-secondary">TikTok</a>
    </div>
  </div>
</section>
